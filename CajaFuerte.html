<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="satoshi.css"/>
        <link rel="stylesheet" href="./reset.css"/>
        <link rel="stylesheet" href="CajaFuerte.css"/>
        <title>Caja Fuerte</title>
    </head>
    <body>
     <header class="header">
        <div class="logo">
          <img src="./Henry-logo.png" alt="Logo Header">
        </div>
        <div>
         <nav class="nav">
           <a href="LandingPI.html" class="nav-btn">Home</a>
           <a href="GeneradorDeContraseñas.html" class="nav-btn">Generar contraseña</a>
           <a href="CajaFuerte.html" class="nav-btn">Caja fuerte</a>
           <a href="SistemaMonitoreo.html" class="nav-btn">Monitoreo de actividad</a>
           <a href="#" class="nav-btn">Gestión de usuarios</a>
         </nav>
        </div>
     </header>
     <main>
        <section class="titles">
         <h1 class="title">Asistente De Seguridad</h1>
         <p class="subtitle">CAJA FUERTE</p>
        </section>
        <section class="cards">

            <div class="row">
                <label for="code">Código Secreto</label>
                <input type="password" id="code"/>

                <label for="tries">Cantidad de intentos</label>
                <input type="number" id="tries" min="1" max="5"/>

                <button id="saveBtn">GUARDAR</button>
            </div>

            <div class="row-validate">
                <label for="validate">Validar Código Secreto</label>
                <input type="password" id="validate"/>
            </div>

            <div class="row-buttons">
                <button id="validateBtn">VALIDAR CÓDIGO</button>
                <button id="resetBtn">RESET</button>
            </div>

        </section>
     </main>
     <script src="CajaFuerte.js"></script>
     </body>
</html>
