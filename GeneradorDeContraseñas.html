<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="satoshi.css"/>
        <link rel="stylesheet" href="./reset.css"/>
        <link rel="stylesheet" href="GeneraContraseñas.css"/>
        <title>Generador De Contraseñas</title>
    </head>
    <body>
     <header class="header">
        <div class="logo">
          <img src="./Henry-logo.png" alt="Logo Header">
        </div>
        <div>
         <nav class="nav">
           <a href="LandingPI.html" class="nav-btn">Home</a>
           <a href="GeneradorDeContraseñas.html" class="nav-btn">Generar contraseña</a>
           <a href="CajaFuerte.html" class="nav-btn">Caja fuerte</a>
           <a href="SistemaMonitoreo.html" class="nav-btn">Monitoreo de actividad</a>
           <a href="#" class="nav-btn">Gestión de usuarios</a>
         </nav>
        </div>
     </header>
     <main>
        <h1 class="title">Asistente de Seguridad</h1>
        <p class="subtitle">Generador de constraseñas para usuarios:</p>
    <section class="card">
       <div class="form-group">
           <label for="length">Cantidad de caracteres deseados</label>
           <input type="number" id="length" min="4" max="10" />
       </div>

       <div class="form-group checkbox-group">
          <label for="special">¿Incluir caracteres especiales?</label>
          <input type="checkbox" id="special" />
       </div>

       <div class="form-group checkbox-group">
         <label for="numbers">¿Incluir caracteres números?</label>
         <input type="checkbox" id="numbers" />
       </div>

        <div class="form-group checkbox-group">
         <label for="uppercase">¿Incluir caracteres mayúsculas?</label>
         <input type="checkbox" id="uppercase" />
       </div>

      <button class="btn" id="generar">Generar contraseña</button>
    </section>
     </main>
    <script src="GeneraContraseña.js"></script>
    </body>
</html>
